# on: GitHub watches for push and pull request events on the main branch.
# runs-on: GitHub provides a temporary Ubuntu machine to execute your workflow.
# checkout: Downloads your repository code into that machine.
# setup-node: Installs the specified Node.js version.
# npm ci: Installs dependencies based on your lockfile.
# tsc: Checks TypeScript errors.
# npm test: Executes your automated tests.
# npm run build: Builds your application.

name: Ticket Booking CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/movie-ticket-booking-testing
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      JWT_ACCESS_SECRET_KEY: ${{ secrets.JWT_ACCESS_SECRET_KEY }}
      JWT_REFRESH_SECRET_KEY: ${{ secrets.JWT_REFRESH_SECRET_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Tests
        run: npm test

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage-report
          path: coverage/
          if-no-files-found: ignore

  build:
    name: Build Project
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build --if-present

      - name: Build Successful
        run: echo "Build completed successfully."

  deploy:
    name: Deployment Readiness
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deployment Status
        run: |
          echo "===================================="
          echo "CI Pipeline Successful"
          echo "Tests Passed"
          echo "Build Successful"
          echo "Ready for Deployment"
          echo "Branch: ${{ github.ref_name }}"
          echo "===================================="
